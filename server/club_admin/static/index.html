<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>官网后台 · 上海大学人工智能社</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<div id="http-warning" class="banner warn" hidden>
  当前是 HTTP 连接：密码和登录凭据在网络上以<strong>明文</strong>传输，同一网络里的人有可能截获。正式使用前请为网站配置 HTTPS。
</div>

<header class="topbar">
  <div class="brand"><span class="brand-mark">AI</span><span>人工智能社 · 官网后台</span></div>
  <div class="who" id="who" hidden>
    <span id="who-name"></span>
    <button type="button" class="btn small ghost" id="logout">退出</button>
  </div>
</header>

<main id="login-view" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <h1>登录</h1>
    <p class="muted">管理员账号由社团负责人在服务器终端创建，网页上不能注册。</p>
    <label class="field"><span>用户名</span><input name="username" autocomplete="username" required maxlength="32"></label>
    <label class="field"><span>密码</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
    <div class="form-error" id="login-error" role="alert"></div>
    <button class="btn primary block" type="submit">登录</button>
    <p class="muted small" id="login-http-note" hidden>提醒：现在是 HTTP，密码以明文传输。请不要在公共 Wi-Fi 下登录，也不要使用在别处用过的密码。</p>
  </form>
</main>

<div id="app-view" class="layout" hidden>
  <nav class="sidenav" aria-label="后台导航">
    <div class="nav-group">内容</div>
    <a href="#/news" data-route="news">新闻动态</a>
    <a href="#/programs" data-route="programs">活动类型</a>
    <a href="#/honors" data-route="honors">荣誉成果</a>
    <a href="#/people" data-route="people">人物</a>
    <a href="#/join" data-route="join">加入我们</a>
    <a href="#/meta" data-route="meta">社团信息</a>
    <div class="nav-group">管理</div>
    <a href="#/history" data-route="history">历史版本</a>
    <a href="#/board" data-route="board">排行榜</a>
    <a href="#/audit" data-route="audit">操作记录</a>
    <a href="#/status" data-route="status">服务器状态</a>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin/static/admin.js"></script>
</body>
</html>
