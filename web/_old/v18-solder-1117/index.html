<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上海大学人工智能社</title>
<meta name="description" content="上海大学人工智能社：挂靠通信与信息工程学院团委，平时做电路焊接课、华为昇腾 AI 实践课、企业参访，协办上海大学人工智能创新大赛。全校可来，零基础也行。">
<meta name="theme-color" content="#0f1211">
<link rel="icon" href="../shared/img/ip/zhi-flat.webp" type="image/webp">
<link rel="stylesheet" href="../shared/fonts/fonts.css?v=1">
<link rel="stylesheet" href="style.css?v=1">
<script>
  /* 模式判定：动效可用 → live（吸顶舞台）；减少动态 / 不支持 → 普通分节页面。
     首屏入场动画有 2.5s setTimeout 兜底，后台标签页也不会卡在半路。 */
  (function (d) {
    var r = d.documentElement, q = location.search;
    var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ok = !!(window.requestAnimationFrame && window.CanvasRenderingContext2D &&
      window.CSS && CSS.supports && CSS.supports('position', 'sticky'));
    if (!rm && ok && !/[?&]flat\b/.test(q)) r.classList.add('live');
    if (!rm && !/[?&](at|beat)=/.test(q)) {
      r.classList.add('intro');
      setTimeout(function () { r.classList.add('intro-done'); }, 2500);
    }
  })(document);
</script>
</head>
<body>
<a class="skip" href="#s1">跳到正文</a>
<main id="main">
  <div class="track" id="track">
    <div class="stage" id="stage">
      <canvas id="cv-board" aria-hidden="true"></canvas>
      <div class="world" id="world">

        <section class="st st0" id="s0" aria-labelledby="t0">
          <div class="hero">
            <h1 class="hero-title ko" id="t0"><span class="l1"><span class="ch" style="--i:0">上</span><span class="ch" style="--i:1">海</span><span class="ch" style="--i:2">大</span><span class="ch" style="--i:3">学</span></span><span class="l2"><span class="ch" style="--i:4">人</span><span class="ch" style="--i:5">工</span><span class="ch" style="--i:6">智</span><span class="ch" style="--i:7">能</span><span class="ch" style="--i:8">社</span></span></h1>
            <p class="hero-lead ko">焊接课、昇腾 AI 课、企业参访，协办人工智能创新大赛。<br>全校可来，零基础也行。</p>
            <div class="hero-act ko">
              <button class="btn" type="button" data-go="4">怎么加入</button>
              <span class="hint">往下滑，开始焊接 <i aria-hidden="true">↓</i></span>
            </div>
          </div>
          <div class="pwr ko" data-part="pwr" aria-hidden="true"><span class="pwr-lab">电源</span></div>
          <div class="logo ko" data-part="logo" aria-hidden="true"><span class="ko">小智</span></div>
        </section>

        <section class="st st1" id="s1" aria-labelledby="t1">
          <h2 class="ink ko" id="t1">平时做什么</h2>
          <ol class="progs" id="progs"></ol>
        </section>

        <section class="st st2" id="s2" aria-labelledby="t2">
          <h2 class="ink ko" id="t2">做过的事</h2>
          <p class="sub ink ko" id="news-sub"></p>
          <ol class="chips" id="chips"></ol>
          <button class="btn btn-all ko" id="btn-all" type="button" aria-haspopup="dialog"></button>
        </section>

        <section class="st st3" id="s3" aria-labelledby="t3">
          <div class="who">
            <h2 class="ink ko" id="t3">谁在带大家</h2>
            <div class="who-a" id="lead-a"></div>
            <div class="disp ko" id="disp"><div class="glass"><img id="lead-photo" alt="" width="228" height="671"><i class="flash" aria-hidden="true"></i></div></div>
            <div class="who-b" id="lead-b"></div>
          </div>
        </section>

        <section class="st st4" id="s4" aria-labelledby="t4">
          <div class="join">
            <div class="join-txt">
              <h2 class="ink ko" id="t4">怎么加入</h2>
              <p class="jl ink ko">全校同学都能来，零基础也行。</p>
              <ol class="steps" id="steps"></ol>
            </div>
            <div class="join-led">
              <button class="bigled ko" id="bigled" type="button"><span class="pkg"></span><span class="die"></span><span class="dome"></span><span class="glow"></span></button>
              <p class="led-hint ink ko" id="led-hint"></p>
              <p class="led-msg" id="led-msg" role="status" aria-live="polite"></p>
            </div>
          </div>
        </section>

      </div>
      <canvas id="cv-fx" aria-hidden="true"></canvas>
      <nav class="tps" id="tps" aria-label="章节进度"></nav>
    </div>
  </div>

  <footer class="foot" id="foot">
    <div class="foot-in">
      <section class="faq" aria-labelledby="faq-h">
        <h2 id="faq-h">常见问题</h2>
        <dl id="faq"></dl>
      </section>
      <section class="info" aria-labelledby="info-h">
        <h2 id="info-h">社团信息</h2>
        <ul id="info"></ul>
      </section>
    </div>
    <div class="foot-bot">
      <img src="../shared/img/brand/scie-wordmark.png" alt="上海大学通信与信息工程学院" width="3526" height="738" loading="lazy">
      <p>资料整理自通信学院官网公开报道 · <a href="/admin/">管理后台</a></p>
    </div>
  </footer>
</main>

<dialog id="dlg" aria-labelledby="dlg-h">
  <div class="dlg-in">
    <div class="dlg-top">
      <h2 id="dlg-h"></h2>
      <button class="dlg-x" id="dlg-x" type="button">关闭</button>
    </div>
    <ol class="nlist" id="nlist"></ol>
    <p class="dlg-src">均为上海大学通信与信息工程学院官网报道，点开看原文。</p>
  </div>
</dialog>

<script src="../shared/content.js?v=1"></script>

</html>
